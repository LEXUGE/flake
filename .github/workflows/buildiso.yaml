name: "Build customized NixOS LiveCD ISO"
on:
  push:
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: write

jobs:
  create-release:
    if: (startsWith(github.event.head_commit.message, 'build:') || (github.event_name == 'schedule'))
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      release_name: ${{ steps.release_meta.outputs.release_name }}
      should_build: ${{ steps.get_log.outputs.log_num != '0' }}
    steps:
      - uses: actions/checkout@v6
      - name: Compute release metadata
        id: release_meta
        run: |
          timestamp="$(date -u +'%Y%m%d_%H%M')"
          echo "tag_name=build-${timestamp}" >> "$GITHUB_OUTPUT"
          echo "release_name=Automated build ${timestamp}" >> "$GITHUB_OUTPUT"
      - name: Get log
        id: get_log
        run: |
          echo "log_num=$(git --no-pager log --since '24 hours ago' --pretty=format:%h%x09%an%x09%ad%x09%s --date short | grep -c '')" >> "$GITHUB_OUTPUT"
      - name: Create release
        if: ${{ steps.get_log.outputs.log_num != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.release_meta.outputs.tag_name }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.release_meta.outputs.tag_name }}" \
              --title "${{ steps.release_meta.outputs.release_name }}"
          else
            gh release create "${{ steps.release_meta.outputs.tag_name }}" \
              --target "${GITHUB_SHA}" \
              --title "${{ steps.release_meta.outputs.release_name }}" \
              --notes ""
          fi

  buildiso:
    name: Build ISO for ${{ matrix.target }}
    if: ${{ needs.create-release.outputs.should_build == 'true' }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        target: ["imgs.tb14" ]
        # target: ["imgs.deck", "imgs.tb14" ]
        # GitHub Action may not have enough space to build the deck image.
        # target: ["imgs.x1c7"]

    runs-on: ubuntu-latest
    steps:
    # - name: Maximize build space
    #   uses: easimon/maximize-build-space@master
    #   with:
    #     # Reserved for /tmp
    #     root-reserve-mb: 25600
    #     swap-size-mb: 1024
    #     temp-reserve-mb: 100
    #     build-mount-path: '/nix'
    #     build-mount-path-ownership: 'root:root'
    #     remove-dotnet: 'true'
    #     remove-android: 'true'
    #     remove-haskell: 'true'
    #     remove-codeql: 'true'
    #     remove-docker-images: 'true'
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install nixFlake
      uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: lexuge
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Don't push source or .iso files as they are pointless to take up precious cache space.
        pushFilter: '(-source$|nixpkgs\.tar\.gz$|\.iso$|-squashfs.img$|crate-$)'
    - uses: cachix/cachix-action@v17
      with:
        name: dcompass
        skipPush: true

    # NOTE: Don't update automatically, it breaks build
    # - name: Update flake.lock, show drv, and calculate the hashes
    #   id: update
    #   run: |
    #     nix flake update

    - name: Build LiveCD ISO image
      id: iso
      run: |
        nix build ".#${{ matrix.target }}"
        cp "result/iso/$(ls "$(readlink result)/iso/")" ./${{ matrix.target }}.iso
        echo "iso-checksum=$(sha512sum ./${{ matrix.target }}.iso|cut -d " " -f 1)" >> $GITHUB_OUTPUT
        split -a 3 -b 2047M --numeric-suffixes=1 ./${{ matrix.target }}.iso ${{ matrix.target }}.
        rm ./${{ matrix.target }}.iso

    - name: Publish
      uses: softprops/action-gh-release@v2.6.2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: '${{ matrix.target }}*'
        append_body: true
        body: |
          The SHA-512 checksum of image ${{ matrix.target }} is ${{ steps.iso.outputs.iso-checksum }}.
        name: ${{ needs.create-release.outputs.release_name }}
        tag_name: ${{ needs.create-release.outputs.tag_name }}

  remove-release:
    name: Clean up release(s)
    if: ${{ needs.create-release.outputs.should_build == 'true' }}
    needs:
      - create-release
      - buildiso
    runs-on: ubuntu-latest
    steps:
    - name: Clean-up releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mapfile -t old_tags < <(
          gh release list \
            --limit 100 \
            --json tagName,createdAt,isDraft \
            --jq 'map(select((.tagName | startswith("build-")) and (.isDraft | not))) | sort_by(.createdAt) | reverse | .[7:] | .[].tagName'
        )

        if [ "${#old_tags[@]}" -eq 0 ]; then
          exit 0
        fi

        for tag in "${old_tags[@]}"; do
          gh release delete "$tag" --cleanup-tag -y
        done
